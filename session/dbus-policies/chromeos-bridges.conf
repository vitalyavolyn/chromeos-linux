<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Allow any user to own and call the ChromeOS bridge service names.
    These are normally owned by privileged ChromeOS daemons; here our
    bridge processes (running as the session user) impersonate them.
  -->

  <!-- shill (network) -->
  <policy context="default">
    <allow own="org.chromium.flimflam"/>
    <allow send_destination="org.chromium.flimflam"/>
    <allow receive_sender="org.chromium.flimflam"/>
  </policy>

  <!-- CRAS (audio) -->
  <policy context="default">
    <allow own="org.chromium.cras"/>
    <allow send_destination="org.chromium.cras"/>
    <allow receive_sender="org.chromium.cras"/>
  </policy>

  <!-- PowerManager (battery/suspend) -->
  <policy context="default">
    <allow own="org.chromium.PowerManager"/>
    <allow send_destination="org.chromium.PowerManager"/>
    <allow send_interface="org.chromium.PowerManager"/>
    <allow receive_sender="org.chromium.PowerManager"/>
  </policy>

  <!-- SessionManager (login/lock) -->
  <policy context="default">
    <allow own="org.chromium.SessionManager"/>
    <allow send_destination="org.chromium.SessionManager"/>
    <allow receive_sender="org.chromium.SessionManager"/>
  </policy>

  <!-- UserDataAuth (cryptohome / guest home) -->
  <policy context="default">
    <allow own="org.chromium.UserDataAuth"/>
    <allow send_destination="org.chromium.UserDataAuth"/>
    <allow receive_sender="org.chromium.UserDataAuth"/>
  </policy>

  <!-- Rmad (RMA daemon) -->
  <policy context="default">
    <allow own="org.chromium.Rmad"/>
    <allow send_destination="org.chromium.Rmad"/>
    <allow receive_sender="org.chromium.Rmad"/>
  </policy>

  <!-- Crostini (Linux apps in launcher) -->
  <policy context="default">
    <allow own="org.chromium.VmConcierge"/>
    <allow send_destination="org.chromium.VmConcierge"/>
    <allow receive_sender="org.chromium.VmConcierge"/>
    <allow own="org.chromium.VmCicerone"/>
    <allow send_destination="org.chromium.VmCicerone"/>
    <allow receive_sender="org.chromium.VmCicerone"/>
    <allow own="org.chromium.DlcService"/>
    <allow send_destination="org.chromium.DlcService"/>
    <allow receive_sender="org.chromium.DlcService"/>
    <allow own="org.chromium.ImageLoader"/>
    <allow send_destination="org.chromium.ImageLoader"/>
    <allow receive_sender="org.chromium.ImageLoader"/>
    <allow own="org.chromium.debugd"/>
    <allow send_destination="org.chromium.debugd"/>
    <allow receive_sender="org.chromium.debugd"/>
  </policy>

  <!--
    Ash-owned ChromeOS browser services.

    With CHROMEOS_RELEASE_NAME set, Ash registers a set of in-process D-Bus
    services on the system bus. ChromeOS policy normally permits the browser
    process to own these names; plain Linux D-Bus policy refuses them and Ash
    treats that as fatal.
  -->
  <policy user="ash">
    <allow own_prefix="org.chromium"/>
    <allow send_destination_prefix="org.chromium"/>
    <allow receive_sender_prefix="org.chromium"/>
    <!-- allow bridge to call VmApplicationsService.UpdateApplicationList on Chrome.
         Explicit send_destination+send_interface needed because context="default"
         denies all method_calls, and send_destination_prefix is not specific
         enough to override it. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"/>
    <allow receive_sender="org.chromium.VmApplicationsService"/>
  </policy>
</busconfig>
